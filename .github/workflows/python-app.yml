name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize test data
        run: |
          ./tests/init_test_data.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install .
          # netcdf4 is needed by sisl for reading SIESTA .nc Hamiltonians.
          pip install netcdf4

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (default pytest profile)
        run: |
          pytest
