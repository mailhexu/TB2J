name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize test data
        run: |
          ./tests/init_test_data.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.12.5 pytest
          pip install .
          # The scientific references and sparse-SIESTA tests require fixes
          # not yet released in HamiltonIO 0.3.8. Pin the tested development
          # revision until a release containing them is available.
          pip install --no-deps 'git+https://github.com/mailhexu/HamiltonIO.git@0e71cfc88f721c8d15bc945c123d7fb92f96b174'
          # netcdf4 is needed by sisl for reading SIESTA .nc Hamiltonians.
          pip install netcdf4

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (default pytest profile)
        run: |
          pytest
