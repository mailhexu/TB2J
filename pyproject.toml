[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TB2J"
version = "0.9.18"
description = "TB2J: First principle to Heisenberg exchange J using tight-binding Green function method"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Xu He", email = "mailhexu@gmail.com" }]
maintainers = [{ name = "Xu He", email = "mailhexu@gmail.com" }]
keywords = ["magnetism", "DFT", "Heisenberg", "exchange", "physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "numpy",
    "scipy>=1.9,<1.17",
    "matplotlib",
    "ase>=3.19",
    "tqdm",
    "pathos",
    "packaging>=20.0",
    "HamiltonIO>=0.3.8",
    "pre-commit",
    "sympair>=0.1.4",
    "supercellmap",
    "tomli>=2.0.0",
    "pypao>=0.1.0",
    "tomli-w>=1.0.0",
    "typing_extensions",
    "sisl>=0.16.2",
    "h5py",
]

[project.optional-dependencies]
siesta = ["sisl>=0.9.0", "netcdf4"]
lawaf = ["lawaf>=0.2.3"]
all = ["sisl>=0.9.0", "netcdf4", "lawaf>=0.2.3"]

[project.urls]
Homepage = "https://github.com/mailhexu/TB2J"
Documentation = "https://tb2j.readthedocs.io/en/latest/"
Repository = "https://github.com/mailhexu/TB2J"
Issues = "https://github.com/mailhexu/TB2J/issues"

[project.scripts]
"wann2J.py" = "TB2J.scripts.wann2J:run_wann2J"
"siesta2J.py" = "TB2J.scripts.siesta2J:run_siesta2J"
"abacus2J.py" = "TB2J.scripts.abacus2J:run_abacus2J"
"TB2J_rotate.py" = "TB2J.scripts.TB2J_rotate:main"
"TB2J_rotateDM.py" = "TB2J.scripts.TB2J_rotateDM:main"
"TB2J_merge.py" = "TB2J.scripts.TB2J_merge:main"
"TB2J_downfold.py" = "TB2J.scripts.TB2J_downfold:main"
"TB2J_eigen.py" = "TB2J.scripts.TB2J_eigen:write_eigen_info"
"TB2J_magnon.py" = "TB2J.magnon.magnon_cli:main"
"TB2J_symmetrize.py" = "TB2J.symmetrize_J:symmetrize_J_cli"
"lawaf2J.py" = "TB2J.interfaces.lawaf_interface:lawaf2J_cli"
"TB2J_edit.py" = "TB2J.scripts.TB2J_edit:main"
"TB2J_edit" = "TB2J.scripts.TB2J_edit:main"
"TB2J_plot_exchange.py" = "TB2J.scripts.TB2J_plot_exchange:main"
"dmft2J.py" = "TB2J.scripts.dmft2J:run_dmft2J"
"sprkkr2magnon.py" = "TB2J.scripts.sprkkr2magnon:main"


[tool.setuptools]
packages = ["TB2J"]

[tool.setuptools.package-data]
TB2J = ["**/*.py"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # Vendored third-party code (copied from p_tqdm).
    "TB2J/external/p_tqdm.py",
    # Dev/scratch scripts not imported by the package.
    "TB2J/utest.py",
    "TB2J/spinham/plot.py",
    # Separate test-data submodule (not this repository's source).
    "tests/data",
]
line-length = 88
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"


[tool.pytest.ini_options]
# Make the tests/ helper packages (e.g. utils.spinio_checks) importable.
pythonpath = ["tests"]
testpaths = ["tests"]
filterwarnings = [
    # Fail on unregistered marker usage so marker typos can't slip in silently.
    "error::pytest.PytestUnknownMarkWarning",
]
markers = [
    # Validation tiers (ADR-001/005).
    "tier1: workflow smoke / structural contract at a public entry point",
    "tier2: scientific validation — schema + toleranced quantities + invariants",
    "tier3: ecosystem producer/consumer reproduction (optional deps/data)",
    # Execution profiles (ADR-004). The default profile deselects the others.
    "default: routine CPU profile (~10 min); runs in CI without optional deps",
    "slow: broader stored-input / full scientific validation, run on demand",
    "gpu: requires JAX / a GPU; CPU-only import path is tested separately",
    "ecosystem: T3 producer/consumer cases (ABINIT+abinao, spin-phonon, ...)",
]
# Default profile: everything except the opt-in slow/gpu/ecosystem work, so a
# bare `pytest` is the fast CI/release signal (ADR-004).
addopts = ["-m", "not slow and not gpu and not ecosystem"]